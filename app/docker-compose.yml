services:
  ghost:
    build:
      context: .
      dockerfile: dockerfile
    image: registry.gitlab.com/rafaellacera/ghostblog:${IMAGE_TAG:-latest}
    container_name: ghost
    restart: on-failure
    ports:
      - "8090:2368"
    environment:
      url: ${GHOST_URL:-http://localhost:8090}
      database__client: mysql
      database__connection__host: ${DB_HOST}
      database__connection__port: ${DB_PORT:-3306}
      database__connection__user: ${DB_USER}
      database__connection__password: ${DB_PASSWORD}
      database__connection__database: ${DB_NAME}
      # "local" (Ghost stocke sur le disque, ok pour tester en local) par
      # defaut ; le role Ansible force "s3" au deploiement reel, pour que
      # les medias survivent a la recreation de l'instance EC2.
      storage__active: ${STORAGE_ACTIVE:-local}
      storage__s3__bucket: ${S3_BUCKET}
      storage__s3__region: ${AWS_DEFAULT_REGION:-eu-west-3}
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2368"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ghost-net

networks:
  ghost-net:
    driver: bridge
