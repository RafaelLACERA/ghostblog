services:
  ghost-db:
    image: mysql:8.0
    container_name: ghost-db
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ghost_db}
      MYSQL_USER: ${MYSQL_USER:-ghost_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ghost_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ghost-net

  ghost-blue:
    image: ghost:6-alpine
    container_name: ghost-blue
    restart: on-failure
    depends_on:
      ghost-db:
        condition: service_healthy
    ports:
      - "8090:2368"
    environment:
      url: ${GHOST_URL_BLUE:-https://ghost.lacera.fr}
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__user: ${MYSQL_USER:-ghost_user}
      database__connection__password: ${MYSQL_PASSWORD:-ghost_password}
      database__connection__database: ${MYSQL_DATABASE:-ghost_db}
    volumes:
      - ghost_content_blue:/var/lib/ghost/content
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2368"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ghost-net

  ghost-green:
    image: ghost:6-alpine
    container_name: ghost-green
    restart: on-failure
    depends_on:
      ghost-db:
        condition: service_healthy
    ports:
      - "8091:2368"
    environment:
      url: ${GHOST_URL_GREEN:-https://preprod.lacera.fr}
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__user: ${MYSQL_USER:-ghost_user}
      database__connection__password: ${MYSQL_PASSWORD:-ghost_password}
      database__connection__database: ${MYSQL_DATABASE:-ghost_db}
    volumes:
      - ghost_content_green:/var/lib/ghost/content
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2368"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ghost-net

networks:
  ghost-net:
    driver: bridge

volumes:
  db_data:
  ghost_content_blue:
  ghost_content_green: