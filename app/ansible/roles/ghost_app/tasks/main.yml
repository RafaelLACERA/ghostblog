---
- name: Creer le repertoire de l'application
  ansible.builtin.file:
    path: "{{ ghost_app_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Copier le docker-compose.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "{{ ghost_app_dir }}/docker-compose.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"

- name: Generer le fichier .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ ghost_app_dir }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Authentification au registry GitLab Container Registry
  ansible.builtin.command:
    cmd: "docker login -u {{ ghost_app_registry_user }} -p {{ ghost_app_registry_password }} {{ ghost_app_registry_url }}"
  no_log: true
  changed_when: false

- name: Tirer les images et demarrer la stack
  ansible.builtin.command:
    cmd: docker compose up -d --pull always
    chdir: "{{ ghost_app_dir }}"
  changed_when: true
