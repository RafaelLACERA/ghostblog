---
- name: Creer le repertoire de l'application
  ansible.builtin.file:
    path: "{{ ghost_app_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Copier le docker-compose.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "{{ ghost_app_dir }}/docker-compose.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"

- name: Generer le fichier .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ ghost_app_dir }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: "0600"

# --password-stdin plutot que -p : un mot de passe passe en argument de
# ligne de commande reste visible (meme brievement) via "ps aux" pour
# n'importe quel autre utilisateur de la machine. La variable
# d'environnement REGISTRY_PASSWORD n'a pas ce probleme.
- name: Authentification au registry GitLab Container Registry
  ansible.builtin.shell:
    cmd: set -o pipefail && echo "$REGISTRY_PASSWORD" | docker login -u "{{ ghost_app_registry_user }}" --password-stdin "{{ ghost_app_registry_url }}"
    executable: /bin/bash
  environment:
    REGISTRY_PASSWORD: "{{ ghost_app_registry_password }}"
  no_log: true
  changed_when: false

- name: Tirer les images et demarrer la stack
  ansible.builtin.command:
    # --remove-orphans nettoie les conteneurs d'un service qui a disparu du
    # docker-compose.yml (ex: l'ancien ghost-db local, remplace par RDS) -
    # docker compose up ne les supprime jamais tout seul sinon.
    cmd: docker compose up -d --pull always --remove-orphans
    chdir: "{{ ghost_app_dir }}"
  # Toujours "changed" par simplification : parser la sortie de "docker
  # compose up" pour distinguer un vrai changement d'un no-op est fragile
  # (le format de sortie varie selon les versions de Docker Compose) et le
  # cout de se tromper est nul ici (ce n'est pas utilise pour conditionner
  # d'autres taches).
  changed_when: true

# Sans cette verification, le job reussit des que "docker compose up" a
# demarre le conteneur, meme si Ghost plante juste apres (mauvaise config
# DB, migration ratee...). Le healthcheck du docker-compose.yml existait
# deja mais n'etait jamais consulte. start_period (30s) + interval (10s) *
# retries (3) du healthcheck = jusqu'a ~60s avant le premier statut
# definitif cote Docker, d'ou une marge de 90s ici.
- name: Verifier la sante de Ghost (avec diagnostic si echec)
  block:
    - name: Attendre que le conteneur Ghost soit en bonne sante
      ansible.builtin.command:
        cmd: "docker inspect --format {% raw %}'{{.State.Health.Status}}'{% endraw %} ghost"
      register: ghost_app_health
      until: ghost_app_health.stdout == "healthy"
      retries: 18
      delay: 5
      changed_when: false
  rescue:
    # Sans ca, un echec ici ne donne aucune piste (juste "unhealthy") -
    # les logs du conteneur montrent la vraie erreur (config invalide,
    # crash au demarrage...).
    - name: Recuperer les logs du conteneur Ghost pour diagnostic
      ansible.builtin.command: docker logs --tail 100 ghost
      register: ghost_app_logs
      changed_when: false
      failed_when: false

    - name: Afficher les logs recuperes
      ansible.builtin.debug:
        var: ghost_app_logs.stdout_lines

    - name: Faire echouer la tache (le diagnostic ne doit pas masquer l'echec)
      ansible.builtin.fail:
        msg: "Ghost n'a jamais atteint l'etat 'healthy' - voir les logs Docker ci-dessus."
