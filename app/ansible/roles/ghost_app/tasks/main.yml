---
- name: Creer le repertoire de l'application
  ansible.builtin.file:
    path: "{{ ghost_app_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Copier le docker-compose.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "{{ ghost_app_dir }}/docker-compose.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"

- name: Generer le fichier .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ ghost_app_dir }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: "0600"

# --password-stdin plutot que -p : un mot de passe passe en argument de
# ligne de commande reste visible (meme brievement) via "ps aux" pour
# n'importe quel autre utilisateur de la machine. La variable
# d'environnement REGISTRY_PASSWORD n'a pas ce probleme.
- name: Authentification au registry GitLab Container Registry
  ansible.builtin.shell:
    cmd: echo "$REGISTRY_PASSWORD" | docker login -u "{{ ghost_app_registry_user }}" --password-stdin "{{ ghost_app_registry_url }}"
  environment:
    REGISTRY_PASSWORD: "{{ ghost_app_registry_password }}"
  no_log: true
  changed_when: false

- name: Tirer les images et demarrer la stack
  ansible.builtin.command:
    # --remove-orphans nettoie les conteneurs d'un service qui a disparu du
    # docker-compose.yml (ex: l'ancien ghost-db local, remplace par RDS) -
    # docker compose up ne les supprime jamais tout seul sinon.
    cmd: docker compose up -d --pull always --remove-orphans
    chdir: "{{ ghost_app_dir }}"
  changed_when: true
