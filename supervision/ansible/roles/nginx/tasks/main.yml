---
- name: Installer nginx et certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
    state: present
    update_cache: true

- name: Desactiver le site nginx par defaut
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Recharger nginx

# force: false : apres le premier run, Certbot gere ce fichier (HTTPS)
- name: Deployer la configuration initiale du reverse proxy Grafana (HTTP)
  ansible.builtin.template:
    src: monitoring.conf.j2
    dest: /etc/nginx/sites-available/monitoring.conf
    mode: "0644"
    force: false
  notify: Recharger nginx

- name: Activer le site monitoring
  ansible.builtin.file:
    src: /etc/nginx/sites-available/monitoring.conf
    dest: /etc/nginx/sites-enabled/monitoring.conf
    state: link
  notify: Recharger nginx

- name: Verifier la configuration nginx
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Demarrer nginx et l'activer au boot
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

# Certbot a besoin de la nouvelle configuration deja chargee
- name: Appliquer le rechargement de nginx avant Certbot
  ansible.builtin.meta: flush_handlers

# Sinon NXDOMAIN si le DNS n'a pas encore propage
- name: Attendre que le domaine resolve avant Certbot
  ansible.builtin.command: getent hosts {{ nginx_domain }}
  register: nginx_dns_check
  until: nginx_dns_check.rc == 0
  retries: 12
  delay: 10
  changed_when: false

- name: Obtenir le certificat HTTPS via Certbot (premiere fois uniquement)
  ansible.builtin.command:
    cmd: >
      certbot --nginx -d {{ nginx_domain }}
      -m {{ nginx_certbot_email }}
      --non-interactive --agree-tos --redirect
    creates: "/etc/letsencrypt/live/{{ nginx_domain }}/fullchain.pem"
