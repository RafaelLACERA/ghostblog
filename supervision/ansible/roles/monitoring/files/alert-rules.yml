apiVersion: 1

# Alerte P1 (service indisponible -> intervention immediate) : la cible
# node_exporter (app ou staging) ne repond plus au scrape Prometheus.
# "up == bool 0" et pas "up == 0" : la version sans bool renvoie la valeur
# brute de up (0) pour les series filtrees, pas un booleen exploitable par
# le seuil - "0 > 0" est toujours faux. Verifie en local avant de pousser
# (docker compose Prometheus+Grafana, cible factice injoignable) : sans
# "bool" l'alerte ne se declenche jamais malgre une config qui se charge
# sans erreur.
groups:
  - orgId: 1
    name: ghostblog-alerts
    folder: ghostblog
    interval: 1m
    rules:
      - uid: instance-down
        title: "Instance down (app/staging)"
        condition: seuil
        data:
          - refId: requete
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus-ds
            model:
              expr: "up == bool 0"
              instant: true
              refId: requete
          - refId: seuil
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: requete
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: seuil
        for: 2m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: "node_exporter ne repond plus (up == 0) - instance probablement arretee ou UFW/SG bloque le port 9100"
        noDataState: NoData
        execErrState: Error

      # P1 vue utilisateur : le site ne repond plus en HTTPS, meme si la machine tourne
      - uid: site-down
        title: "Site injoignable (app/staging/supervision)"
        condition: seuil
        data:
          - refId: requete
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus-ds
            model:
              expr: "probe_success == bool 0"
              instant: true
              refId: requete
          - refId: seuil
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: requete
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: seuil
        for: 2m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: "Le site ne repond plus en HTTPS (probe_success == 0) - verifier le conteneur Ghost, Nginx, le certificat ou le DNS"
        noDataState: NoData
        execErrState: Error

      # Seuil SLA documente (voir dossier-projet) : 85% choisi car proche
      # du point de swapping observe lors de l'incident memoire reel sur
      # t3.micro (voir project_t3micro_memory_pressure).
      - uid: memory-high
        title: "Memoire elevee (app/staging/supervision)"
        condition: seuil
        data:
          - refId: requete
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus-ds
            model:
              expr: "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100"
              instant: true
              refId: requete
          - refId: seuil
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: requete
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
              refId: seuil
        for: 5m
        labels:
          severity: warning
          priority: P2
        annotations:
          summary: "Memoire utilisee > 85% pendant 5 min - risque de swapping/pression memoire"
        noDataState: OK
        execErrState: Error

      - uid: cpu-high
        title: "CPU elevee (app/staging/supervision)"
        condition: seuil
        data:
          - refId: requete
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus-ds
            model:
              expr: "100 - (avg by (env, instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"
              instant: true
              refId: requete
          - refId: seuil
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: requete
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
              refId: seuil
        for: 5m
        labels:
          severity: warning
          priority: P2
        annotations:
          summary: "CPU utilisee > 90% pendant 5 min"
        noDataState: OK
        execErrState: Error

      - uid: disk-high
        title: "Disque racine plein (app/staging/supervision)"
        condition: seuil
        data:
          - refId: requete
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus-ds
            model:
              expr: "100 - ((node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"}) * 100)"
              instant: true
              refId: requete
          - refId: seuil
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: requete
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
              refId: seuil
        for: 5m
        labels:
          severity: warning
          priority: P2
        annotations:
          summary: "Disque racine utilise > 80% - risque de panne par manque d'espace"
        noDataState: OK
        execErrState: Error
