---
- name: Creer les repertoires de l'application
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  loop:
    - "{{ monitoring_dir }}"
    - "{{ monitoring_dir }}/grafana/provisioning/datasources"
    - "{{ monitoring_dir }}/grafana/provisioning/dashboards"
    - "{{ monitoring_dir }}/grafana/provisioning/alerting"
    - "{{ monitoring_dir }}/grafana/dashboards"

- name: Deployer le docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"

- name: Deployer la configuration Prometheus
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_dir }}/prometheus.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"

# copy et non template : fichiers YAML statiques, aucune variable Jinja
# dedans (contrairement a contact-points.yml.j2, qui reste un vrai
# template) - meme piege que le dashboard JSON plus tot : template
# fonctionnerait aussi, mais copy+files/ est le bon outil pour du contenu
# fige, cf. convention du reste du role.
- name: Provisionner la datasource Grafana (Prometheus, automatique au demarrage)
  ansible.builtin.copy:
    src: datasource.yml
    dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/datasource.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  notify: Redemarrer grafana

- name: Provisionner le fournisseur de dashboards Grafana
  ansible.builtin.copy:
    src: dashboards.yml
    dest: "{{ monitoring_dir }}/grafana/provisioning/dashboards/dashboards.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  notify: Redemarrer grafana

- name: Provisionner la regle d'alerte "instance down"
  ansible.builtin.copy:
    src: alert-rules.yml
    dest: "{{ monitoring_dir }}/grafana/provisioning/alerting/alert-rules.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  notify: Redemarrer grafana

- name: Provisionner le contact point (email)
  ansible.builtin.template:
    src: contact-points.yml.j2
    dest: "{{ monitoring_dir }}/grafana/provisioning/alerting/contact-points.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  notify: Redemarrer grafana

- name: Provisionner la politique de notification
  ansible.builtin.copy:
    src: notification-policies.yml
    dest: "{{ monitoring_dir }}/grafana/provisioning/alerting/notification-policies.yml"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  notify: Redemarrer grafana

- name: Copier le dashboard node_exporter pre-construit
  ansible.builtin.copy:
    src: dashboard-node-exporter.json
    dest: "{{ monitoring_dir }}/grafana/dashboards/dashboard-node-exporter.json"
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  notify: Redemarrer grafana

- name: Tirer les images et demarrer la stack
  ansible.builtin.command:
    cmd: docker compose up -d --pull always --remove-orphans
    chdir: "{{ monitoring_dir }}"
  changed_when: true

# Doit s'executer apres "docker compose up -d" (le conteneur doit deja
# exister pour qu'un restart soit possible) mais avant le healthcheck
# (sinon celui-ci validerait l'etat d'avant redemarrage).
- name: Appliquer immediatement le redemarrage de Grafana si necessaire
  ansible.builtin.meta: flush_handlers

# Meme logique que ghost_app : ne pas se contenter de "le conteneur a
# demarre", verifier que Grafana repond vraiment avant de considerer le
# deploiement reussi.
- name: Verifier la sante de Grafana (avec diagnostic si echec)
  block:
    - name: Attendre que l'API de sante Grafana reponde
      ansible.builtin.uri:
        url: "http://127.0.0.1:3000/api/health"
        status_code: 200
      register: monitoring_grafana_health
      until: monitoring_grafana_health.status == 200
      retries: 18
      delay: 5
  rescue:
    - name: Recuperer les logs du conteneur Grafana pour diagnostic
      ansible.builtin.command: docker logs --tail 100 grafana
      register: monitoring_grafana_logs
      changed_when: false
      failed_when: false

    - name: Afficher les logs recuperes
      ansible.builtin.debug:
        var: monitoring_grafana_logs.stdout_lines

    - name: Faire echouer la tache (le diagnostic ne doit pas masquer l'echec)
      ansible.builtin.fail:
        msg: "Grafana n'a jamais repondu sur /api/health - voir les logs Docker ci-dessus."
