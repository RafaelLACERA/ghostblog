include:
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - .pre
  - build
  - test
  - provisioning
  - deploy
  - destroy

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Consommees par app/terraform/instances/remote_state.tf pour lire le state
  # persistant app-data (VPC/subnets/security group). Inoffensives pour
  # les jobs qui ne les utilisent pas.
  TF_VAR_gitlab_api_url: $CI_API_V4_URL
  TF_VAR_gitlab_project_id: $CI_PROJECT_ID
  TF_VAR_gitlab_ci_job_token: $CI_JOB_TOKEN

.tf_image:
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]

.tf_backend_init:
  script:
    - >
      terraform init
      -backend-config="address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
      -backend-config="lock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
      -backend-config="unlock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
      -backend-config="username=gitlab-ci-token"
      -backend-config="password=${CI_JOB_TOKEN}"
      -backend-config="lock_method=POST"
      -backend-config="unlock_method=DELETE"
      -backend-config="retry_wait_min=5"

.t_terraform_validate:
  extends: .tf_image
  stage: .pre
  script:
    - cd $TF_DIR
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate

terraform_validate_app:
  extends: .t_terraform_validate
  variables:
    TF_DIR: app/terraform/instances
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/instances/**/*

terraform_validate_supervision:
  extends: .t_terraform_validate
  variables:
    TF_DIR: supervision/terraform
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - supervision/terraform/**/*

terraform_validate_data:
  extends: .t_terraform_validate
  variables:
    TF_DIR: app/terraform/persistent
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/persistent/**/*

terraform_validate_dns:
  extends: .t_terraform_validate
  variables:
    TF_DIR: app/terraform/dns
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/dns/**/*

# Job manuel unique (bouton GitLab) : fmt -> init -> validate -> plan -> apply.
# GitLab arrete le job a la premiere commande en echec (ex: plan invalide),
# l'apply ne s'execute donc jamais si une etape precedente a echouer
.t_terraform_deploy:
  extends: .tf_image
  stage: provisioning
  script:
    - cd $TF_DIR
    - terraform fmt -check -recursive
    - !reference [.tf_backend_init, script]
    - terraform validate
    - terraform plan -out=tfplan
    - terraform apply tfplan

deploy_app_infra:
  extends: .t_terraform_deploy
  variables:
    TF_DIR: app/terraform/instances
    TF_STATE_NAME: app
    TF_VAR_supervision_ip_cidr: $SUPERVISION_IP_CIDR
  environment:
    name: app
    action: start
  # Empeche ce job de tourner en meme temps que destroy_app_infra/
  # deliver_staging/deploy_prod (meme instances cibles) : GitLab met les
  # jobs partageant ce resource_group en file d'attente au lieu de les
  # laisser tourner en parallele.
  resource_group: app_infra
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/instances/**/*
        - app/ansible/**/*
      when: manual
      allow_failure: true
    # Pipeline lance a la main (bouton "Run pipeline" dans l'UI GitLab,
    # accessible depuis un telephone) : rend le bouton disponible sans
    # attendre qu'une MR touche les bons fichiers. Utile le jour de la
    # soutenance, sans PC.
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# Couche persistante (VPC, subnets, security group) : jamais detruite par le
# cycle de test EC2 (deploy_app_infra/destroy_app_infra), volontairement
# separee dans son propre state.
deploy_data:
  extends: .t_terraform_deploy
  variables:
    TF_DIR: app/terraform/persistent
    TF_STATE_NAME: app-data
    TF_VAR_supervision_ip_cidr: $SUPERVISION_IP_CIDR
  environment:
    name: data
    action: start
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/persistent/**/*
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# Enregistrements DNS OVH (ghost.lacera.fr/staging.lacera.fr) : lit les IP
# publiques dans le state "app" (instances EC2), doit donc etre lance apres
# deploy_app_infra.
deploy_dns:
  extends: .t_terraform_deploy
  variables:
    TF_DIR: app/terraform/dns
    TF_STATE_NAME: app-dns
  # Lookup souple de l'IP de l'instance supervision (curl+jq sur l'API du
  # state "supervision"), plutot qu'un data.terraform_remote_state cote
  # Terraform : ce dernier echoue durement ("Unable to find remote state")
  # si le state n'a jamais ete applique une seule fois - deja vu en test
  # reel. before_script s'execute dans le meme shell que le script hérité
  # de .t_terraform_deploy : la variable exportee ici lui reste visible.
  before_script:
    - apk add --no-cache curl jq
    - >
      curl -sS -o supervision_state.json -w "HTTP %{http_code}\n"
      -u "gitlab-ci-token:${CI_JOB_TOKEN}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/supervision" || true
    - export TF_VAR_supervision_public_ip=$(jq -r '.outputs.supervision_public_ip.value // empty' supervision_state.json 2>/dev/null || true)
  environment:
    name: dns
    action: start
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/dns/**/*
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# Instance de supervision (Prometheus/Grafana) : lit le state "app-data"
# (subnet, security group), cycle de vie totalement independant de
# deploy_app_infra/deploy_data - resource_group dedie ci-dessous.
deploy_supervision:
  extends: .t_terraform_deploy
  variables:
    TF_DIR: supervision/terraform
    TF_STATE_NAME: supervision
  environment:
    name: supervision
    action: start
  resource_group: supervision
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - supervision/terraform/**/*
        - supervision/ansible/**/*
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# Job manuel de demontage complet, pour eviter de supprimer les ressources
# a la main dans la console AWS.
.t_terraform_destroy:
  extends: .tf_image
  stage: destroy
  script:
    - cd $TF_DIR
    - !reference [.tf_backend_init, script]
    - terraform destroy -auto-approve

destroy_app_infra:
  extends: .t_terraform_destroy
  variables:
    TF_DIR: app/terraform/instances
    TF_STATE_NAME: app
    TF_VAR_supervision_ip_cidr: $SUPERVISION_IP_CIDR
  environment:
    name: app
    action: stop
  resource_group: app_infra
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/instances/**/*
        - app/ansible/**/*
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

destroy_data:
  extends: .t_terraform_destroy
  variables:
    TF_DIR: app/terraform/persistent
    TF_STATE_NAME: app-data
    TF_VAR_supervision_ip_cidr: $SUPERVISION_IP_CIDR
  environment:
    name: data
    action: stop
  # Detruire app-data (VPC/subnets/security group) alors que des EC2 tournent
  # encore dedans echoue cote AWS (DependencyViolation) : ce garde-fou
  # verifie l'etat "app" avant de commencer, pour donner un message clair
  # plutot qu'une erreur AWS a moitie comprehensible.
  # Telecharger dans un fichier puis grep le fichier (plutot que curl | grep
  # -q directement) : grep -q peut fermer le tube des qu'il a lu assez de
  # donnees, ce qui casse l'ecriture de curl en cours de route (erreur 23)
  # et fausse le test - deja vu en test reel.
  before_script:
    - apk add --no-cache curl
    - >
      curl -sS -o app_state.json -w "HTTP %{http_code}\n"
      -u "gitlab-ci-token:${CI_JOB_TOKEN}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/app"
    - >
      if grep -q "aws_instance" app_state.json; then
        echo "Des instances EC2 existent encore dans le state 'app' : lance destroy_app_infra avant destroy_data."
        exit 1
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/persistent/**/*
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

destroy_dns:
  extends: .t_terraform_destroy
  variables:
    TF_DIR: app/terraform/dns
    TF_STATE_NAME: app-dns
  environment:
    name: dns
    action: stop
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/dns/**/*
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

destroy_supervision:
  extends: .t_terraform_destroy
  variables:
    TF_DIR: supervision/terraform
    TF_STATE_NAME: supervision
  environment:
    name: supervision
    action: stop
  resource_group: supervision
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - supervision/terraform/**/*
        - supervision/ansible/**/*
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

build_ghost_image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    # --password-stdin plutot que -p : evite que le mot de passe apparaisse
    # dans les arguments du process docker (visible via "ps aux").
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Pas de tag :latest : le pipeline cible toujours une image par son SHA
    # exact (extra_vars.json/.env), :latest ne serait jamais utilise en
    # pratique et gonflerait le registry pour rien sur chaque MR.
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -f app/dockerfile app
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/dockerfile
        - app/docker-compose.yml
        - app/ansible/**/*
        - app/terraform/instances/**/*
    # deliver_staging/deploy_prod en dependent (needs non-optionnel) : doit
    # exister aussi sur un pipeline lance a la main.
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Recupere IP + cle SSH + infos RDS depuis le state Terraform et lance
# Ansible, dans le MEME job : la cle privee et le mot de passe RDS ne
# quittent jamais le systeme de fichiers ephemere de ce job (pas d'artifact
# GitLab telechargeable, meme de facon temporaire).
# TF_ENV_PREFIX designe l'environnement cible (app ou staging) : tous les
# outputs Terraform necessaires sont derives de ce prefixe. Chaque job ne
# cible qu'UN environnement a la fois - staging est teste avant que prod
# ne soit mise a jour.
# Le mot de passe RDS (genere par random_password) peut contenir des
# caracteres speciaux ($, !, (), etc.) : on construit les extra-vars via un
# fichier JSON genere par jq plutot que des "-e cle=valeur" en ligne de
# commande, pour eviter tout risque de corruption/injection shell.
# Technique jq (--arg/--argjson pour echapper proprement chaque valeur)
# elaboree avec l'aide de Claude Code et Gemini.
.t_ansible_deploy:
  extends: .tf_image
  stage: deploy
  variables:
    TF_DIR: app/terraform/instances
    TF_STATE_NAME: app
    ANSIBLE_CONFIG: $CI_PROJECT_DIR/app/ansible/ansible.cfg
  # Pas de needs sur deploy_app_infra : ce serait redondant avec le
  # garde-fou (verifie que l'IP/la base existent) et le resource_group
  # (empeche toute course avec un deploy/destroy en cours), et ca forcerait
  # un clic inutile sur deploy_app_infra a chaque nouveau pipeline meme
  # quand l'infra existe deja et n'a pas change.
  # Les jobs de test automatiques (pas manuels) sont necessaires en needs :
  # sans ca, GitLab ignore l'ordre des stages et ce job peut demarrer/finir
  # avant qu'un gate ait fini de s'executer, voire alors qu'il echoue -
  # contredit le "zero tolerance" sur les tests. optional: true indispensable
  # partout ici : chaque regle ci-dessous est plus etroite que celle de ce
  # job (ex: tflint_app ne couvre que app/terraform/instances/**/*) - sur
  # une MR qui ne les declenche pas, ces jobs n'existent pas du tout dans
  # le pipeline, et un needs non-optionnel casserait deliver_staging/
  # deploy_prod avec une erreur de configuration plutot que d'ignorer
  # simplement une dependance absente.
  needs:
    - job: build_ghost_image
    - job: scan_ghost_image
      optional: true
    - job: ansible_lint
      optional: true
    - job: tflint_app
      optional: true
    - job: hadolint_dockerfile
      optional: true
  before_script:
    - apk add --no-cache ansible openssh-client jq curl
  script:
    - cd $TF_DIR
    - !reference [.tf_backend_init, script]
    # GitLab execute tout ce script comme un seul shell continu (le cd $TF_DIR
    # plus haut reste actif ici) : pas besoin de fichiers intermediaires, les
    # variables shell suffisent et restent valables apres le "cd ../../.."
    # plus bas. Seule la cle SSH doit rester un vrai fichier (--private-key
    # en a besoin).
    - TARGET_IP=$(terraform output -raw ${TF_ENV_PREFIX}_public_ip)
    - DB_HOST=$(terraform output -raw ${TF_ENV_PREFIX}_db_host)
    - DB_PORT=$(terraform output -raw ${TF_ENV_PREFIX}_db_port)
    - DB_NAME=$(terraform output -raw ${TF_ENV_PREFIX}_db_name)
    - DB_USER=$(terraform output -raw ${TF_ENV_PREFIX}_db_user)
    - DB_PASSWORD=$(terraform output -raw ${TF_ENV_PREFIX}_db_password)
    - S3_BUCKET=$(terraform output -raw ${TF_ENV_PREFIX}_s3_bucket)
    - terraform output -raw app_ssh_private_key > ../../../ssh_key.pem
    - chmod 600 ../../../ssh_key.pem
    - cd ../../..
    - >
      if [ -z "$TARGET_IP" ] || [ -z "$DB_HOST" ]; then
        echo "IP ou base de donnees manquante : verifier deploy_app_infra et deploy_data."
        exit 1
      fi
    - >
      jq -n
      --arg image_tag "$CI_COMMIT_SHORT_SHA"
      --arg registry_url "$CI_REGISTRY"
      --arg registry_user "$CI_REGISTRY_USER"
      --arg registry_password "$CI_REGISTRY_PASSWORD"
      --arg db_host "$DB_HOST"
      --argjson db_port "$DB_PORT"
      --arg db_name "$DB_NAME"
      --arg db_user "$DB_USER"
      --arg db_password "$DB_PASSWORD"
      --arg ghost_url "$GHOST_URL"
      --arg s3_bucket "$S3_BUCKET"
      '{ghost_app_image_tag:$image_tag,ghost_app_registry_url:$registry_url,ghost_app_registry_user:$registry_user,ghost_app_registry_password:$registry_password,ghost_app_db_host:$db_host,ghost_app_db_port:$db_port,ghost_app_db_name:$db_name,ghost_app_db_user:$db_user,ghost_app_db_password:$db_password,ghost_app_url:$ghost_url,ghost_app_s3_bucket:$s3_bucket}'
      > extra_vars.json
    - ansible-playbook -i "${TARGET_IP}," -u ubuntu --private-key ssh_key.pem app/ansible/playbook.yml -e @extra_vars.json
    # Ansible qui reussit veut juste dire "les taches se sont executees",
    # pas "le site repond vraiment" - meme logique que le healthcheck deja
    # present dans le role ghost_app, mais verifie ici depuis l'exterieur
    # (comme un vrai visiteur), a travers Nginx/Certbot/DNS, pas juste en
    # local sur l'instance.
    - >
      HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$GHOST_URL")
    - >
      if [ "$HTTP_CODE" != "200" ]; then
        echo "Echec de la verification post-deploiement : $GHOST_URL a repondu HTTP $HTTP_CODE (attendu 200)"
        exit 1
      fi
    - >
      echo "Deploiement confirme : $GHOST_URL repond HTTP 200"

# Continuous Delivery : chaque push livre automatiquement la nouvelle image
# sur staging, sans creer ni couter d'infra supplementaire (l'instance doit
# deja exister). La mise en prod reste un choix manuel separe (deploy_prod) :
# ce n'est pas du Continuous Deployment.
# GHOST_URL_STAGING/GHOST_URL_APP (variables CI/CD GitLab, Settings > CI/CD >
# Variables) doivent toujours avoir une valeur (ex: http://localhost:8090 en
# attendant le DNS) : une variable vide ecraserait le defaut du role Ansible
# par une chaine vide au lieu de le laisser s'appliquer.
deliver_staging:
  extends: .t_ansible_deploy
  variables:
    TF_ENV_PREFIX: staging
    GHOST_URL: $GHOST_URL_STAGING
  environment:
    name: staging
  resource_group: app_infra
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/instances/**/*
        - app/ansible/**/*
        - app/dockerfile
        - app/docker-compose.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# Manuel : promotion volontaire vers prod du meme tag d'image que celui
# valide sur staging, jamais automatique.
deploy_prod:
  extends: .t_ansible_deploy
  variables:
    TF_ENV_PREFIX: app
    GHOST_URL: $GHOST_URL_APP
  environment:
    name: app
  resource_group: app_infra
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/instances/**/*
        - app/ansible/**/*
        - app/dockerfile
        - app/docker-compose.yml
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

# Configuration Ansible de l'instance de supervision (Prometheus/Grafana).
# Pas d'extension de .t_ansible_deploy (specifique a Ghost : DB/S3/registry) :
# job dedie, plus simple. Les IP privees app/staging sont recuperees en
# "lookup souple" via l'API du state "app" (curl+jq, meme technique que le
# garde-fou de destroy_data) plutot que via un data.terraform_remote_state -
# volontaire, pour ne jamais faire echouer ce job si l'infra Ghost est
# detruite (cycle de vie de la supervision totalement independant).
# MONITORING_DOMAIN (variable CI/CD GitLab) : "monitoring.lacera.fr".
# GRAFANA_ADMIN_PASSWORD (variable CI/CD GitLab, masquee) : mot de passe du
# compte admin Grafana.
deploy_supervision_config:
  extends: .tf_image
  stage: deploy
  variables:
    TF_DIR: supervision/terraform
    TF_STATE_NAME: supervision
    ANSIBLE_CONFIG: $CI_PROJECT_DIR/supervision/ansible/ansible.cfg
  before_script:
    - apk add --no-cache ansible openssh-client curl jq
  script:
    - cd $TF_DIR
    - !reference [.tf_backend_init, script]
    - TARGET_IP=$(terraform output -raw supervision_public_ip)
    - terraform output -raw supervision_ssh_private_key > ../../ssh_key.pem
    - chmod 600 ../../ssh_key.pem
    - cd ../..
    - >
      if [ -z "$TARGET_IP" ]; then
        echo "IP supervision manquante : verifier deploy_supervision."
        exit 1
      fi
    - >
      curl -sS -o app_state.json -w "HTTP %{http_code}\n"
      -u "gitlab-ci-token:${CI_JOB_TOKEN}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/app"
    - APP_IP=$(jq -r '.outputs.app_private_ip.value // empty' app_state.json)
    - STAGING_IP=$(jq -r '.outputs.staging_private_ip.value // empty' app_state.json)
    - >
      if [ -z "$APP_IP" ]; then
        echo "IP privee app introuvable (deploy_app_infra jamais lance ou state 'app' detruit) - cible ignoree."
      fi
    - >
      if [ -z "$STAGING_IP" ]; then
        echo "IP privee staging introuvable - cible ignoree."
      fi
    - APP_TARGET=""
    - if [ -n "$APP_IP" ]; then APP_TARGET="${APP_IP}:9100"; fi
    - STAGING_TARGET=""
    - if [ -n "$STAGING_IP" ]; then STAGING_TARGET="${STAGING_IP}:9100"; fi
    - >
      ansible-playbook -i "${TARGET_IP}," -u ubuntu --private-key ssh_key.pem
      supervision/ansible/playbook.yml
      -e monitoring_grafana_admin_password="$GRAFANA_ADMIN_PASSWORD"
      -e monitoring_app_target="$APP_TARGET"
      -e monitoring_staging_target="$STAGING_TARGET"
      -e monitoring_smtp_host="$MONITORING_SMTP_HOST"
      -e monitoring_smtp_user="$MONITORING_SMTP_USER"
      -e monitoring_smtp_password="$MONITORING_SMTP_PASSWORD"
      -e nginx_domain="$MONITORING_DOMAIN"
  environment:
    name: supervision
  resource_group: supervision
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - supervision/terraform/**/*
        - supervision/ansible/**/*
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

tflint_app:
  stage: test
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  script:
    - cd app/terraform/instances
    - tflint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/instances/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

tflint_data:
  stage: test
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  script:
    - cd app/terraform/persistent
    - tflint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/persistent/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

tflint_dns:
  stage: test
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  script:
    - cd app/terraform/dns
    - tflint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/dns/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

tflint_supervision:
  stage: test
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  script:
    - cd supervision/terraform
    - tflint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - supervision/terraform/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Aucun gate CI n'existait pour les roles Ansible jusqu'ici (contrairement
# a Terraform/tflint et au Dockerfile/hadolint) - ansible-lint tournait
# uniquement en local, a la main, avant de pousser. Meme commande que
# celle utilisee manuellement tout au long du projet (profil "production",
# le plus strict), donc pas de surprise attendue au premier lancement.
ansible_lint:
  stage: test
  image: python:3.12-slim
  before_script:
    # community.general fournit le module "ufw" utilise par le role
    # hardening - sans cette collection, ansible-lint echoue avec
    # "couldn't resolve module/action 'community.general.ufw'", meme si
    # le code est correct (teste en local avant de pousser ce job).
    - pip install --no-cache-dir ansible-lint ansible-core
    - ansible-galaxy collection install community.general
  script:
    - ansible-lint app/ansible/ supervision/ansible/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/ansible/**/*
        - supervision/ansible/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

hadolint_dockerfile:
  stage: test
  image:
    name: hadolint/hadolint:latest-debian
    entrypoint: [""]
  script:
    - hadolint app/dockerfile
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/dockerfile
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Scan de vulnerabilites (CVE) sur l'image Ghost buildee. Rapport complet
# HIGH+CRITICAL en exit-code 0 (informatif, jamais bloquant), puis un
# deuxieme passage cible uniquement sur CRITICAL en exit-code 1 : si une
# faille critique apparait, le job echoue et bloque le pipeline.
scan_ghost_image:
  stage: test
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  needs:
    - build_ghost_image
  script:
    - trivy image --exit-code 0 --severity CRITICAL,HIGH $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    # .trivyignore : CVE deja examinees individuellement et documentees
    # (voir le fichier), jamais une CVE non encore regardee. Trivy se met
    # a jour a chaque run - une CVE peut apparaitre du jour au lendemain
    # sur une image qu'on n'a pourtant pas touchee (deja arrive : 3
    # CRITICAL trouvees le 2026-09-15 sur du code inchange depuis des
    # jours, toutes dans des binaires embarques par ghost:6-alpine).
    - trivy image --exit-code 1 --severity CRITICAL --ignorefile .trivyignore $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    # SECOURS SOUTENANCE UNIQUEMENT : si une nouvelle CVE CRITICAL bloque
    # le jour J sans le temps de l'investiguer/l'ajouter au .trivyignore en
    # connaissance de cause, commenter la ligne du dessus et decommenter
    # celle-ci pour debloquer en urgence - jamais a activer par defaut.
    # - trivy image --exit-code 0 --severity CRITICAL --ignorefile .trivyignore $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  # Meme regle que build_ghost_image, pas juste "app/dockerfile" : le
  # Dockerfile fait "apk update && apk upgrade" (voir plus haut), donc une
  # nouvelle image construite sur un Dockerfile INCHANGE peut quand meme
  # contenir des paquets Alpine differents (chaque build_ghost_image
  # tourne sur un runner neuf, sans cache Docker persistant entre deux
  # pipelines - il retelecharge les paquets tels qu'ils sont a cet
  # instant). Se caler sur "le Dockerfile a change" plutot que "une
  # nouvelle image a ete construite" aurait laisse passer des builds
  # jamais scannes.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/dockerfile
        - app/docker-compose.yml
        - app/ansible/**/*
        - app/terraform/instances/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Scan des images officielles utilisees par la stack de supervision (pas de
# Dockerfile a nous ici, images tirees telles quelles) - informatif
# uniquement (exit-code 0) : contrairement a scan_ghost_image, on ne peut
# pas corriger le contenu de ces images, seule une mise a jour de version
# en amont le peut. Comble le meme trou que scan_ghost_image, sur les
# composants tiers deployes plutot que sur l'image qu'on construit.
scan_supervision_images:
  stage: test
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --exit-code 0 --severity CRITICAL,HIGH prom/prometheus:v3.1.0
    - trivy image --exit-code 0 --severity CRITICAL,HIGH grafana/grafana:11.4.0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - supervision/ansible/roles/monitoring/templates/docker-compose.yml.j2
    - if: '$CI_PIPELINE_SOURCE == "web"'