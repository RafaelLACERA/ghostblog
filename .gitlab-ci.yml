include:
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - .pre
  - build
  - test
  - deploy

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Consommees par app/terraform/remote_state.tf pour lire le state
  # persistant app-data (VPC/subnets/security group). Inoffensives pour
  # les jobs qui ne les utilisent pas.
  TF_VAR_gitlab_api_url: $CI_API_V4_URL
  TF_VAR_gitlab_project_id: $CI_PROJECT_ID
  TF_VAR_gitlab_ci_job_token: $CI_JOB_TOKEN

.tf_image:
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]

.tf_backend_init:
  script:
    - >
      terraform init
      -backend-config="address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
      -backend-config="lock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
      -backend-config="unlock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
      -backend-config="username=gitlab-ci-token"
      -backend-config="password=${CI_JOB_TOKEN}"
      -backend-config="lock_method=POST"
      -backend-config="unlock_method=DELETE"
      -backend-config="retry_wait_min=5"

.t_terraform_validate:
  extends: .tf_image
  stage: .pre
  script:
    - cd $TF_DIR
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate

terraform_validate_app:
  extends: .t_terraform_validate
  variables:
    TF_DIR: app/terraform
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/**/*

terraform_validate_supervision:
  extends: .t_terraform_validate
  variables:
    TF_DIR: supervision/terraform
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - supervision/terraform/**/*

terraform_validate_data:
  extends: .t_terraform_validate
  variables:
    TF_DIR: app/terraform-data
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform-data/**/*

# Job manuel unique (bouton GitLab) : fmt -> init -> validate -> plan -> apply.
# GitLab arrete le job a la premiere commande en echec (ex: plan invalide),
# l'apply ne s'execute donc jamais si une etape precedente a echouer
.t_terraform_deploy:
  extends: .tf_image
  stage: deploy
  script:
    - cd $TF_DIR
    - terraform fmt -check -recursive
    - !reference [.tf_backend_init, script]
    - terraform validate
    - terraform plan -out=tfplan
    - terraform apply tfplan

deploy_app_infra:
  extends: .t_terraform_deploy
  variables:
    TF_DIR: app/terraform
    TF_STATE_NAME: app
    TF_VAR_supervision_ip_cidr: $SUPERVISION_IP_CIDR
  environment:
    name: app
    action: start
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/**/*
        - app/ansible/**/*
      when: manual

# Couche persistante (VPC, subnets, security group) : jamais detruite par le
# cycle de test EC2 (deploy_app_infra/destroy_app_infra), volontairement
# separee dans son propre state. Manuel et rare.
deploy_data:
  extends: .t_terraform_deploy
  variables:
    TF_DIR: app/terraform-data
    TF_STATE_NAME: app-data
    TF_VAR_supervision_ip_cidr: $SUPERVISION_IP_CIDR
  environment:
    name: data
    action: start
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform-data/**/*
      when: manual

# Job manuel de demontage complet, pour eviter de supprimer les ressources
# a la main dans la console AWS.
.t_terraform_destroy:
  extends: .tf_image
  stage: deploy
  script:
    - cd $TF_DIR
    - !reference [.tf_backend_init, script]
    - terraform destroy -auto-approve

destroy_app_infra:
  extends: .t_terraform_destroy
  variables:
    TF_DIR: app/terraform
    TF_STATE_NAME: app
    TF_VAR_supervision_ip_cidr: $SUPERVISION_IP_CIDR
  environment:
    name: app
    action: stop
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/**/*
        - app/ansible/**/*
      when: manual

destroy_data:
  extends: .t_terraform_destroy
  variables:
    TF_DIR: app/terraform-data
    TF_STATE_NAME: app-data
    TF_VAR_supervision_ip_cidr: $SUPERVISION_IP_CIDR
  environment:
    name: data
    action: stop
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform-data/**/*
      when: manual

build_ghost_image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE:latest -f app/dockerfile app
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/dockerfile
        - app/docker-compose.yml
        - app/ansible/**/*
        - app/terraform/**/*

# Recupere IP + cle SSH depuis le state Terraform et lance Ansible, dans le
# MEME job : la cle privee ne quitte jamais le systeme de fichiers ephemere
# de ce job (pas d'artifact GitLab telechargeable contenant la cle, meme
# de facon temporaire - un artifact reste accessible en telechargement par
# quiconque a acces au projet pendant sa duree de vie).
# TF_OUTPUT_IP designe quel output Terraform lire (app_public_ip ou
# staging_public_ip) : chaque job ne cible qu'UNE instance, jamais les deux
# a la fois - staging est teste avant que prod ne soit mise a jour.
.t_ansible_deploy:
  extends: .tf_image
  stage: deploy
  variables:
    TF_DIR: app/terraform
    TF_STATE_NAME: app
    ANSIBLE_CONFIG: $CI_PROJECT_DIR/app/ansible/ansible.cfg
  needs:
    - job: deploy_app_infra
      optional: true
    - job: build_ghost_image
  before_script:
    - apk add --no-cache ansible openssh-client
  script:
    - cd $TF_DIR
    - !reference [.tf_backend_init, script]
    - terraform output -raw $TF_OUTPUT_IP > ../../target_ip.txt
    - terraform output -raw app_ssh_private_key > ../../ssh_key.pem
    - chmod 600 ../../ssh_key.pem
    - cd ../..
    - >
      if [ ! -s target_ip.txt ]; then
        echo "IP manquante : l'instance n'existe pas (lancer deploy_app_infra d'abord)."
        exit 1
      fi
    - >
      ansible-playbook -i "$(cat target_ip.txt)," -u ubuntu --private-key ssh_key.pem
      app/ansible/playbook.yml
      -e ghost_app_image_tag=$CI_COMMIT_SHORT_SHA
      -e ghost_app_registry_url=$CI_REGISTRY
      -e ghost_app_registry_user=$CI_REGISTRY_USER
      -e ghost_app_registry_password=$CI_REGISTRY_PASSWORD

# Continuous Delivery : chaque push livre automatiquement la nouvelle image
# sur staging, sans creer ni couter d'infra supplementaire (l'instance doit
# deja exister). La mise en prod reste un choix manuel separe (deploy_prod) :
# ce n'est pas du Continuous Deployment.
deliver_staging:
  extends: .t_ansible_deploy
  variables:
    TF_OUTPUT_IP: staging_public_ip
  environment:
    name: staging
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/**/*
        - app/ansible/**/*
        - app/dockerfile
        - app/docker-compose.yml

# Manuel : promotion volontaire vers prod du meme tag d'image que celui
# valide sur staging, jamais automatique.
deploy_prod:
  extends: .t_ansible_deploy
  variables:
    TF_OUTPUT_IP: app_public_ip
  environment:
    name: app
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/**/*
        - app/ansible/**/*
        - app/dockerfile
        - app/docker-compose.yml
      when: manual

tflint_app:
  stage: test
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  script:
    - cd app/terraform
    - tflint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/**/*

tflint_data:
  stage: test
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  script:
    - cd app/terraform-data
    - tflint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform-data/**/*

hadolint_dockerfile:
  stage: test
  image:
    name: hadolint/hadolint:latest-debian
    entrypoint: [""]
  script:
    - hadolint app/dockerfile
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/dockerfile

# Scan de vulnerabilites (CVE) sur l'image Ghost buildee. exit-code 0 
scan_ghost_image:
  stage: test
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  needs:
    - build_ghost_image
  script:
    - trivy image --exit-code 0 --severity CRITICAL,HIGH $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/dockerfile