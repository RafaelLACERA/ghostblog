include:
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - .pre
  - build
  - test
  - provisioning
  - deploy
  - destroy

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Pour lire les states distants (terraform_remote_state)
  TF_VAR_gitlab_api_url: $CI_API_V4_URL
  TF_VAR_gitlab_project_id: $CI_PROJECT_ID
  TF_VAR_gitlab_ci_job_token: $CI_JOB_TOKEN

# ===== Modeles reutilises par les jobs =====

.tf_image:
  image:
    name: hashicorp/terraform:1.15
    entrypoint: [""]

.tf_backend_init:
  script:
    - >
      terraform init
      -backend-config="address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
      -backend-config="lock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
      -backend-config="unlock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
      -backend-config="username=gitlab-ci-token"
      -backend-config="password=${CI_JOB_TOKEN}"
      -backend-config="lock_method=POST"
      -backend-config="unlock_method=DELETE"
      -backend-config="retry_wait_min=5"

# Pipeline manuel (Run pipeline) : bouton disponible, pilotable depuis un telephone
.rules_web_manual:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

.t_terraform_validate:
  extends: .tf_image
  stage: .pre
  script:
    - cd $TF_DIR
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate

# Chaque etape doit reussir avant l'apply
.t_terraform_deploy:
  extends: .tf_image
  stage: provisioning
  script:
    - cd $TF_DIR
    - terraform fmt -check -recursive
    - !reference [.tf_backend_init, script]
    - terraform validate
    - terraform plan -out=tfplan
    - terraform apply tfplan

# Demontage sans passer par la console AWS
.t_terraform_destroy:
  extends: .tf_image
  stage: destroy
  script:
    - cd $TF_DIR
    - !reference [.tf_backend_init, script]
    - terraform destroy -auto-approve

# Cle SSH et mot de passe RDS restent dans ce job, jamais en artifact
.t_ansible_deploy:
  extends: .tf_image
  stage: deploy
  variables:
    TF_DIR: app/terraform/instances
    TF_STATE_NAME: app
    ANSIBLE_CONFIG: $CI_PROJECT_DIR/app/ansible/ansible.cfg
  # Pas de deploiement si un gate echoue ; optional car absent de certaines MR
  needs:
    - job: build_ghost_image
    - job: scan_ghost_image
      optional: true
    - job: ansible_lint
      optional: true
    - job: tflint_app
      optional: true
    - job: hadolint_dockerfile
      optional: true
    - job: scan_node_exporter
      optional: true
  before_script:
    - apk add --no-cache ansible openssh-client jq curl
  script:
    - cd $TF_DIR
    - !reference [.tf_backend_init, script]
    # Un seul shell : les variables restent valables apres le cd
    - TARGET_IP=$(terraform output -raw ${TF_ENV_PREFIX}_public_ip)
    - DB_HOST=$(terraform output -raw ${TF_ENV_PREFIX}_db_host)
    - DB_PORT=$(terraform output -raw ${TF_ENV_PREFIX}_db_port)
    - DB_NAME=$(terraform output -raw ${TF_ENV_PREFIX}_db_name)
    - DB_USER=$(terraform output -raw ${TF_ENV_PREFIX}_db_user)
    - DB_PASSWORD=$(terraform output -raw ${TF_ENV_PREFIX}_db_password)
    - S3_BUCKET=$(terraform output -raw ${TF_ENV_PREFIX}_s3_bucket)
    - terraform output -raw app_ssh_private_key > ../../../ssh_key.pem
    - chmod 600 ../../../ssh_key.pem
    - cd ../../..
    - >
      if [ -z "$TARGET_IP" ] || [ -z "$DB_HOST" ]; then
        echo "IP ou base de donnees manquante : verifier deploy_app_infra et deploy_data."
        exit 1
      fi
    # Extra-vars via jq (echappement des secrets), technique vue avec Claude Code et Gemini
    - >
      jq -n
      --arg image_tag "$CI_COMMIT_SHORT_SHA"
      --arg registry_url "$CI_REGISTRY"
      --arg registry_user "$CI_REGISTRY_USER"
      --arg registry_password "$CI_REGISTRY_PASSWORD"
      --arg db_host "$DB_HOST"
      --argjson db_port "$DB_PORT"
      --arg db_name "$DB_NAME"
      --arg db_user "$DB_USER"
      --arg db_password "$DB_PASSWORD"
      --arg ghost_url "$GHOST_URL"
      --arg s3_bucket "$S3_BUCKET"
      '{ghost_app_image_tag:$image_tag,ghost_app_registry_url:$registry_url,ghost_app_registry_user:$registry_user,ghost_app_registry_password:{"__ansible_unsafe":$registry_password},ghost_app_db_host:$db_host,ghost_app_db_port:$db_port,ghost_app_db_name:$db_name,ghost_app_db_user:$db_user,ghost_app_db_password:{"__ansible_unsafe":$db_password},ghost_app_url:$ghost_url,ghost_app_s3_bucket:$s3_bucket}'
      > extra_vars.json
    - ansible-playbook -i "${TARGET_IP}," -u ubuntu --private-key ssh_key.pem app/ansible/playbook.yml -e @extra_vars.json
    # Verification externe : le site doit repondre 200 via DNS et HTTPS
    # --retry : Ghost met ~30 s a demarrer (503 entre-temps), jusqu'a 2 min d'attente
    - >
      HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --retry 12 --retry-delay 10 "$GHOST_URL")
    - >
      if [ "$HTTP_CODE" != "200" ]; then
        echo "Echec de la verification post-deploiement : $GHOST_URL a repondu HTTP $HTTP_CODE (attendu 200)"
        exit 1
      fi
    - >
      echo "Deploiement confirme : $GHOST_URL repond HTTP 200"

# ===== Stage .pre : validation Terraform =====

terraform_validate_app:
  extends: .t_terraform_validate
  variables:
    TF_DIR: app/terraform/instances
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/instances/**/*

terraform_validate_data:
  extends: .t_terraform_validate
  variables:
    TF_DIR: app/terraform/persistent
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/persistent/**/*

terraform_validate_dns:
  extends: .t_terraform_validate
  variables:
    TF_DIR: app/terraform/dns
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/dns/**/*

terraform_validate_supervision:
  extends: .t_terraform_validate
  variables:
    TF_DIR: supervision/terraform
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - supervision/terraform/**/*

# ===== Stage build : image Ghost =====

build_ghost_image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    # --password-stdin : mot de passe absent de ps aux
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Tag par SHA uniquement, jamais :latest
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -f app/dockerfile app
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/dockerfile
        - app/docker-compose.yml
        - app/ansible/**/*
        - app/terraform/instances/**/*
    # Aussi en pipeline web : deliver_staging et deploy_prod en dependent
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ===== Stage test : linters et scans de securite =====

tflint_app:
  stage: test
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  script:
    - cd app/terraform/instances
    - tflint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/instances/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

tflint_data:
  stage: test
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  script:
    - cd app/terraform/persistent
    - tflint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/persistent/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

tflint_dns:
  stage: test
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  script:
    - cd app/terraform/dns
    - tflint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/dns/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

tflint_supervision:
  stage: test
  image:
    name: ghcr.io/terraform-linters/tflint:latest
    entrypoint: [""]
  script:
    - cd supervision/terraform
    - tflint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - supervision/terraform/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Meme profil ansible-lint qu'en local (production)
ansible_lint:
  stage: test
  image: python:3.12-slim
  before_script:
    # community.general : module ufw du role hardening
    - pip install --no-cache-dir ansible-lint ansible-core
    - ansible-galaxy collection install community.general
  script:
    - ansible-lint app/ansible/ supervision/ansible/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/ansible/**/*
        - supervision/ansible/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

hadolint_dockerfile:
  stage: test
  image:
    name: hadolint/hadolint:latest-debian
    entrypoint: [""]
  script:
    - hadolint app/dockerfile
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/dockerfile
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Rapport HIGH+CRITICAL, puis gate bloquant sur CRITICAL
scan_ghost_image:
  stage: test
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  needs:
    - build_ghost_image
  script:
    - trivy image --exit-code 0 --severity CRITICAL,HIGH $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    # .trivyignore : uniquement des CVE examinees et documentees
    - trivy image --exit-code 1 --severity CRITICAL --ignorefile .trivyignore $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  # Memes regles que build_ghost_image : toute image construite est scannee
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/dockerfile
        - app/docker-compose.yml
        - app/ansible/**/*
        - app/terraform/instances/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Meme gate que scan_ghost_image ; une CVE CRITICAL se corrige en montant de version
scan_supervision_images:
  stage: test
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --exit-code 0 --severity CRITICAL,HIGH prom/prometheus:v3.15.0
    - trivy image --exit-code 0 --severity CRITICAL,HIGH grafana/grafana:13.2.3
    - trivy image --exit-code 1 --severity CRITICAL prom/prometheus:v3.15.0
    - trivy image --exit-code 1 --severity CRITICAL grafana/grafana:13.2.3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - supervision/ansible/roles/monitoring/templates/docker-compose.yml.j2
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Binaire natif hors image : meme version que roles/node_exporter/defaults/main.yml
scan_node_exporter:
  stage: test
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    NODE_EXPORTER_VERSION: "1.12.1"
  script:
    - wget -q https://github.com/prometheus/node_exporter/releases/download/v${NODE_EXPORTER_VERSION}/node_exporter-${NODE_EXPORTER_VERSION}.linux-amd64.tar.gz
    - tar xzf node_exporter-${NODE_EXPORTER_VERSION}.linux-amd64.tar.gz
    - trivy rootfs --exit-code 0 --severity CRITICAL,HIGH node_exporter-${NODE_EXPORTER_VERSION}.linux-amd64
    - trivy rootfs --exit-code 1 --severity CRITICAL node_exporter-${NODE_EXPORTER_VERSION}.linux-amd64
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/ansible/roles/node_exporter/**/*
        - supervision/ansible/roles/node_exporter/**/*
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ===== Stage provisioning : creation de l'infrastructure =====

# Couche persistante : state separe, jamais detruite avec les instances
deploy_data:
  extends: .t_terraform_deploy
  variables:
    TF_DIR: app/terraform/persistent
    TF_STATE_NAME: app-data
    TF_VAR_supervision_ip_cidr: $SUPERVISION_IP_CIDR
  environment:
    name: data
    action: start
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/persistent/**/*
      when: manual
      allow_failure: true
    - !reference [.rules_web_manual, rules]

deploy_app_infra:
  extends: .t_terraform_deploy
  variables:
    TF_DIR: app/terraform/instances
    TF_STATE_NAME: app
    TF_VAR_supervision_ip_cidr: $SUPERVISION_IP_CIDR
  environment:
    name: app
    action: start
  # File d'attente avec les jobs qui touchent les memes instances
  resource_group: app_infra
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/instances/**/*
        - app/ansible/**/*
      when: manual
      allow_failure: true
    - !reference [.rules_web_manual, rules]

# Supervision : cycle de vie independant de l'application
deploy_supervision:
  extends: .t_terraform_deploy
  variables:
    TF_DIR: supervision/terraform
    TF_STATE_NAME: supervision
  environment:
    name: supervision
    action: start
  resource_group: supervision
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - supervision/terraform/**/*
        - supervision/ansible/**/*
      when: manual
      allow_failure: true
    - !reference [.rules_web_manual, rules]

# Lit les IP du state app : a lancer apres deploy_app_infra
deploy_dns:
  extends: .t_terraform_deploy
  variables:
    TF_DIR: app/terraform/dns
    TF_STATE_NAME: app-dns
  # Lookup souple : pas d'echec si la supervision n'existe pas
  before_script:
    - apk add --no-cache curl jq
    - >
      curl -sS -o supervision_state.json -w "HTTP %{http_code}\n"
      -u "gitlab-ci-token:${CI_JOB_TOKEN}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/supervision" || true
    - export TF_VAR_supervision_public_ip=$(jq -r '.outputs.supervision_public_ip.value // empty' supervision_state.json 2>/dev/null || true)
  environment:
    name: dns
    action: start
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/dns/**/*
      when: manual
      allow_failure: true
    - !reference [.rules_web_manual, rules]

# ===== Stage deploy : configuration Ansible =====

# Livraison continue en staging ; la prod reste manuelle
deliver_staging:
  extends: .t_ansible_deploy
  variables:
    TF_ENV_PREFIX: staging
    GHOST_URL: $GHOST_URL_STAGING
  environment:
    name: staging
  resource_group: app_infra
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/instances/**/*
        - app/ansible/**/*
        - app/dockerfile
        - app/docker-compose.yml
    - !reference [.rules_web_manual, rules]

# Promotion manuelle vers la prod, meme image que staging
deploy_prod:
  extends: .t_ansible_deploy
  variables:
    TF_ENV_PREFIX: app
    GHOST_URL: $GHOST_URL_APP
  environment:
    name: app
  resource_group: app_infra
  # Prod uniquement depuis main : jamais depuis une MR non mergee
  rules:
    - !reference [.rules_web_manual, rules]

# Lookup souple des IP app/staging : ne bloque pas si l'application est detruite
deploy_supervision_config:
  extends: .tf_image
  stage: deploy
  variables:
    TF_DIR: supervision/terraform
    TF_STATE_NAME: supervision
    ANSIBLE_CONFIG: $CI_PROJECT_DIR/supervision/ansible/ansible.cfg
  before_script:
    - apk add --no-cache ansible openssh-client curl jq
  script:
    - cd $TF_DIR
    - !reference [.tf_backend_init, script]
    - TARGET_IP=$(terraform output -raw supervision_public_ip)
    - terraform output -raw supervision_ssh_private_key > ../../ssh_key.pem
    - chmod 600 ../../ssh_key.pem
    - cd ../..
    - >
      if [ -z "$TARGET_IP" ]; then
        echo "IP supervision manquante : verifier deploy_supervision."
        exit 1
      fi
    - >
      curl -sS -o app_state.json -w "HTTP %{http_code}\n"
      -u "gitlab-ci-token:${CI_JOB_TOKEN}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/app"
    - APP_IP=$(jq -r '.outputs.app_private_ip.value // empty' app_state.json)
    - STAGING_IP=$(jq -r '.outputs.staging_private_ip.value // empty' app_state.json)
    - >
      if [ -z "$APP_IP" ]; then
        echo "IP privee app introuvable (deploy_app_infra jamais lance ou state 'app' detruit) - cible ignoree."
      fi
    - >
      if [ -z "$STAGING_IP" ]; then
        echo "IP privee staging introuvable - cible ignoree."
      fi
    - APP_TARGET=""
    - if [ -n "$APP_IP" ]; then APP_TARGET="${APP_IP}:9100"; fi
    - STAGING_TARGET=""
    - if [ -n "$STAGING_IP" ]; then STAGING_TARGET="${STAGING_IP}:9100"; fi
    - >
      ansible-playbook -i "${TARGET_IP}," -u ubuntu --private-key ssh_key.pem
      supervision/ansible/playbook.yml
      -e monitoring_grafana_admin_password="$GRAFANA_ADMIN_PASSWORD"
      -e monitoring_app_target="$APP_TARGET"
      -e monitoring_staging_target="$STAGING_TARGET"
      -e monitoring_smtp_host="$MONITORING_SMTP_HOST"
      -e monitoring_smtp_user="$MONITORING_SMTP_USER"
      -e monitoring_smtp_password="$MONITORING_SMTP_PASSWORD"
      -e nginx_domain="$MONITORING_DOMAIN"
  environment:
    name: supervision
  resource_group: supervision
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - supervision/terraform/**/*
        - supervision/ansible/**/*
      when: manual
      allow_failure: true
    - !reference [.rules_web_manual, rules]

# ===== Stage destroy : dns d'abord, puis app et supervision, data en dernier =====

destroy_dns:
  extends: .t_terraform_destroy
  variables:
    TF_DIR: app/terraform/dns
    TF_STATE_NAME: app-dns
  environment:
    name: dns
    action: stop
  # Attend la fin des deploiements : ne coupe pas le DNS pendant le controle HTTP 200
  resource_group: app_infra
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/dns/**/*
      when: manual
      allow_failure: true
    - !reference [.rules_web_manual, rules]

destroy_app_infra:
  extends: .t_terraform_destroy
  variables:
    TF_DIR: app/terraform/instances
    TF_STATE_NAME: app
    TF_VAR_supervision_ip_cidr: $SUPERVISION_IP_CIDR
  environment:
    name: app
    action: stop
  resource_group: app_infra
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/instances/**/*
        - app/ansible/**/*
      when: manual
      allow_failure: true
    - !reference [.rules_web_manual, rules]

destroy_supervision:
  extends: .t_terraform_destroy
  variables:
    TF_DIR: supervision/terraform
    TF_STATE_NAME: supervision
  environment:
    name: supervision
    action: stop
  resource_group: supervision
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - supervision/terraform/**/*
        - supervision/ansible/**/*
      when: manual
      allow_failure: true
    - !reference [.rules_web_manual, rules]

destroy_data:
  extends: .t_terraform_destroy
  variables:
    TF_DIR: app/terraform/persistent
    TF_STATE_NAME: app-data
    TF_VAR_supervision_ip_cidr: $SUPERVISION_IP_CIDR
  environment:
    name: data
    action: stop
  # Garde-fou : pas de destruction du reseau tant que des EC2 existent
  before_script:
    - apk add --no-cache curl
    - >
      curl -sS -o app_state.json -w "HTTP %{http_code}\n"
      -u "gitlab-ci-token:${CI_JOB_TOKEN}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/app"
    - >
      if grep -q "aws_instance" app_state.json; then
        echo "Des instances EC2 existent encore dans le state 'app' : lance destroy_app_infra avant destroy_data."
        exit 1
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - app/terraform/persistent/**/*
      when: manual
      allow_failure: true
    - !reference [.rules_web_manual, rules]
